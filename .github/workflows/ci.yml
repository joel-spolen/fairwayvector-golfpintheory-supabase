name: Backend source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # No npm install: the existing Node tests use built-ins and injected fakes.
      - run: npm test
      - run: deno task check
      # SQL is a separate disposable-database release gate, not claimed by CI.
