name: Approved Supabase deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected GitHub environment (configure required reviewers first)
        type: choice
        required: true
        options: [staging, production]
      ledger_reconciled:
        description: I reviewed the target's applied SQL and migration ledger against this commit
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main' && inputs.ledger_reconciled
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm test
      - run: deno task check

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Require operator reconciliation and target secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MIGRATION_LEDGER_RECONCILED: ${{ vars.MIGRATION_LEDGER_RECONCILED }}
        run: |
          set -euo pipefail
          test "$MIGRATION_LEDGER_RECONCILED" = "true"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Link the explicitly approved target
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Review pending migration plan in job log
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run
      - name: Apply only reconciled pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes
      - name: Deploy user-authenticated data endpoint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy golf-data --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy account-deletion endpoint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"
