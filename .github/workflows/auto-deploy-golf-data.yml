name: Deploy golf-data Edge Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/golf-data/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/auto-deploy-golf-data.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-edge-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm test
      - run: deno task check
      - name: Require production project configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Deploy user-authenticated provider-data endpoint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy golf-data --project-ref "$SUPABASE_PROJECT_REF"
